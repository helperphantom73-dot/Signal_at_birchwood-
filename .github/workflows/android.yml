name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          cp -r /root/.config/godot ~/.config/ || true
      - name: Import
        run: godot --headless --import || true
      - name: Export APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android" build/SignalAtBirchwood.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SignalAtBirchwood-apk
          path: build/SignalAtBirchwood.apk
